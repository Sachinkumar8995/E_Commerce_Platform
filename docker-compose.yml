version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: ecommerce-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: ecommerce-api
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/ecommerce
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in your environment}
      - NODE_ENV=development
      - TAX_RATE=0.1
      - SHIPPING_FLAT_RATE=5.99
    command: sh -c "node src/seed.js && node src/server.js"
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: ecommerce-ui
    ports:
      - '3000:3000'
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    depends_on:
      - backend

volumes:
  mongo_data:
